<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Z-APP Preview Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated Background Grid */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }
        
        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            z-index: 1;
        }
        
        .orb1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.4) 0%, rgba(118, 75, 162, 0.2) 70%, transparent 100%);
            top: -150px;
            left: -150px;
        }
        
        .orb2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(139, 92, 246, 0.2) 70%, transparent 100%);
            top: 100px;
            right: -100px;
        }
        
        .orb3 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(37, 99, 235, 0.2) 70%, transparent 100%);
            bottom: -75px;
            left: 200px;
        }
        
        .orb4 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, rgba(5, 150, 105, 0.1) 70%, transparent 100%);
            bottom: -200px;
            right: -200px;
        }
        
        /* Main Content */
        .preview-container {
            text-align: center;
            color: white;
            z-index: 10;
            position: relative;
        }
        
        /* Logo with Glow Effect */
        .logo {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 
                0 25px 80px rgba(102, 126, 234, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            padding: 20px;
        }
        
        .logo-text {
            font-size: 72px;
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .logo::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
            border-radius: 37px;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.6;
        }
        
        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }
        
        /* Title with Gradient */
        .title {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }
        
        /* Subtitle */
        .subtitle {
            font-size: 28px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }
        
        /* Feature Pills */
        .features {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .feature-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        /* Sparkle Effects */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            z-index: 5;
        }
        
        .sparkle1 { top: 80px; left: 200px; opacity: 0.8; }
        .sparkle2 { top: 150px; right: 180px; opacity: 0.6; }
        .sparkle3 { bottom: 120px; left: 150px; opacity: 0.9; }
        .sparkle4 { bottom: 200px; right: 250px; opacity: 0.7; }
        .sparkle5 { top: 200px; left: 50%; opacity: 0.5; }
        
        /* Connection Lines */
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(102, 126, 234, 0.5) 50%, transparent 100%);
            z-index: 2;
        }
        
        .line1 {
            width: 200px;
            top: 100px;
            left: 100px;
            transform: rotate(15deg);
        }
        
        .line2 {
            width: 150px;
            bottom: 150px;
            right: 100px;
            transform: rotate(-25deg);
        }
        
        /* Badge */
        .badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="grid-background"></div>
    
    <!-- Floating Orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    
    <!-- Connection Lines -->
    <div class="connection-line line1"></div>
    <div class="connection-line line2"></div>
    
    <!-- Sparkles -->
    <div class="sparkle sparkle1"></div>
    <div class="sparkle sparkle2"></div>
    <div class="sparkle sparkle3"></div>
    <div class="sparkle sparkle4"></div>
    <div class="sparkle sparkle5"></div>
    
    <!-- Free Badge -->
    <div class="badge">Free</div>
    
    <!-- Main Content -->
    <div class="preview-container">
        <div class="logo">
            <img src="z-logo.png" class="logo-img" alt="Z-APP Logo">
        </div>
        <div class="title">Z-APP</div>
        <div class="subtitle">Connect Instantly - Real-time Chat & Video Calling</div>
        <div class="features">
            <div class="feature">
                <div class="feature-icon">💬</div>
                <span>Instant Chat</span>
            </div>
            <div class="feature">
                <div class="feature-icon">📹</div>
                <span>HD Video Calls</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <span>Secure & Private</span>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <span>Lightning Fast</span>
            </div>
        </div>
    </div>
</body>
</html>
