services:
  - type: web
    name: z-app-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && node scripts/setup-schema.js && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER
        value: true
    healthCheckPath: /health/ping