services:
  - type: web
    name: z-app-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health/ping
    
  - type: pserv
    name: z-app-database
    plan: free
    databaseName: z_app_db
    user: z_app_user